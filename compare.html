<!DOCTYPE html>
<html>
<head>
    <title>Compare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INPUT BOX -->
<div class="popup" id="formBox">
    <h2>Enter Numbers to Compare</h2>
    <input type="text" id="numbers" placeholder="5,2,8,1,9">
    <button onclick="compare()">Compare</button>
</div>

<!-- RESULT BOX -->
<div class="result-container" id="resultBox">

    <h1>Sorting Results</h1>

    <div class="cards">

        <div class="card">
            <h2>Bubble Sort</h2>
            <p id="bubbleResult"></p>
            <p id="bubbleTime"></p>
            <p>Complexity: O(n²)</p>
        </div>

        <div class="card">
            <h2>Merge Sort</h2>
            <p id="mergeResult"></p>
            <p id="mergeTime"></p>
            <p>Complexity: O(n log n)</p>
        </div>

    </div>

    <!-- WINNER -->
    <div class="winner" id="winner"></div>

    <!-- TRY AGAIN BUTTON (FIXED CENTER + GAP) -->
    <button class="try-btn" onclick="reset()">Try Again</button>

</div>

<script src="script.js"></script>

</body>
</html>
