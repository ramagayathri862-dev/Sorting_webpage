<!DOCTYPE html>
<html>
<head>
    <title>Compare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INPUT BOX -->

<div class="popup" id="formBox">

    <h2>Enter Numbers to Compare</h2>

    <input
        type="text"
        id="numbers"
        placeholder="5,2,8,1,9">

    <button onclick="compare()">
        Compare
    </button>

</div>

<!-- RESULT BOX -->

<div class="result-container" id="resultBox">

    <h1>Sorting Results</h1>

    <div class="cards">

        <!-- Bubble -->

        <div class="card">

            <h2>Bubble Sort</h2>

            <p id="bubbleResult"></p>

            <p id="bubbleTime"></p>

            <p>Complexity: O(n²)</p>

            <button onclick="showDetails('Bubble Sort')">
                More Details
            </button>

        </div>

        <!-- Merge -->

        <div class="card">

            <h2>Merge Sort</h2>

            <p id="mergeResult"></p>

            <p id="mergeTime"></p>

            <p>Complexity: O(n log n)</p>

            <button onclick="showDetails('Merge Sort')">
                More Details
            </button>

        </div>

        <!-- Selection -->

        <div class="card">

            <h2>Selection Sort</h2>

            <p id="selectionResult"></p>

            <p id="selectionTime"></p>

            <p>Complexity: O(n²)</p>

            <button onclick="showDetails('Selection Sort')">
                More Details
            </button>

        </div>

        <!-- Insertion -->

        <div class="card">

            <h2>Insertion Sort</h2>

            <p id="insertionResult"></p>

            <p id="insertionTime"></p>

            <p>Complexity: O(n²)</p>

            <button onclick="showDetails('Insertion Sort')">
                More Details
            </button>

        </div>

        <!-- Quick -->

        <div class="card">

            <h2>Quick Sort</h2>

            <p id="quickResult"></p>

            <p id="quickTime"></p>

            <p>Complexity: O(n log n)</p>

            <button onclick="showDetails('Quick Sort')">
                More Details
            </button>

        </div>

    </div>

    <div class="winner" id="winner"></div>

    <button class="try-btn" onclick="reset()">
        Try Again
    </button>

</div>

<script>

window.onload = function(){

    if(localStorage.getItem(
        "compareVisible"
    ) === "true"){

        document.getElementById(
            "formBox"
        ).style.display = "none";

        document.getElementById(
            "resultBox"
        ).style.display = "block";
    }
}

</script>

<script src="script.js"></script>

</body>
</html>
